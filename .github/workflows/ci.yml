name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  validate:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  build-android:
    name: Build Android APK (assembleRelease)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # NOTE: ubuntu-latest images ship an Android SDK already. We intentionally
      # do NOT use android-actions/setup-android: v3 force-replaces cmdline-tools
      # and then hard-requires the obsolete `tools` package, which no longer
      # exists upstream, failing the step. The preinstalled sdkmanager below
      # installs exactly what assembleRelease needs.

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort | tail -1)"
          fi
          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magic-app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
